# Портативная сборка для Windows (Python внутри) — прикрепляется к релизу на GitHub.
# Запускается, когда отправляешь тег версии:  git tag v1.0  →  git push origin v1.0
# Также можно запустить вручную: вкладка Actions → Portable build → Run workflow
# (архив тогда лежит в разделе Artifacts запуска).
name: Portable build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # нужно, чтобы создать релиз и прикрепить архив

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build portable zip
        env:
          PYTHONIOENCODING: utf-8
        run: python build_portable.py --version ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          # GitHub сам добавляет к релизу «Source code (zip)» — без Python; подсказываем, что качать
          body: |
            ## Как установить
            1. Ниже в **Assets** скачай **`GameJournal-${{ github.ref_name }}-windows.zip`**
               (не «Source code» — там только исходный код без Python).
            2. Распакуй в любую папку и запусти **`start.bat`** — сайт откроется в браузере.

            Python устанавливать не нужно. Обновление: распакуй новую версию в новую папку
            и перенеси из старой папки `data/` и `static/covers/`.

      - name: Keep as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameJournal-windows
          path: dist/*.zip
